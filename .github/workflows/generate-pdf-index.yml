name: Generate PDF index

on:
  push:
    branches:
      - main
    paths:
      - "pdfs/**"
      - ".github/workflows/generate-pdf-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate content.json
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path("pdfs")
          items = []

          if root.exists():
              for file in sorted(root.rglob("*")):
                  if file.is_file() and file.suffix.lower() == ".pdf":
                      rel = file.relative_to(root)
                      parts = rel.parts
                      subject = parts[0] if len(parts) > 1 else "General"
                      title = file.stem.replace("_", " ").replace("-", " ")
                      title = " ".join(title.split())

                      items.append({
                          "subject": subject,
                          "title": title,
                          "filename": file.name,
                          "path": file.as_posix()
                      })

          Path("content.json").write_text(
              json.dumps(items, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )

          print(f"Generated {len(items)} PDF entries")

      - name: Commit updated PDF index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.json

          if git diff --cached --quiet; then
            echo "No content.json changes."
          else
            git commit -m "Update PDF index"
            git push
          fi
